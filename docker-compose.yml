# Bot-Baileys-AI — compose untuk Coolify + VPS (DB: MongoDB cloud).
#
# Coolify (cara pakai):
#   1. Deploy resource ini sebagai "Docker Compose".
#   2. JANGAN bind host-port manual — Coolify routing via domain per service
#      (tambah domain di dashboard): `web` → container port 80 (Caddy),
#      `bot` → container port 3001. Itu sebabnya pakai `expose`, bukan `ports`.
#   3. Set env di dashboard Coolify:
#        DATABASE_URL = mongodb+srv://... (wajib — dari DB cloud-mu)
#        VITE_API_URL = https://<domain-api-bot> (wajib rebuild `web`)
#        CORS_ORIGIN  = https://<domain-web> (wajib — kalau tidak, browser
#                       di-block CORS)
#        + secret lain: DASHBOARD_API_TOKEN, AI keys, dsb.
#   4. Redeploy. Error "port is already allocated" kemarin = ada container
#      lama yang masih pegang 3001 — hapus deployment/container lama itu
#      dulu, atau memang bentrok dengan app lain di host yang sama.
#
# Lokal (non-Coolify): uncomment blok `ports:` di bawah bila butuh akses
# langsung http://localhost:8080 / :3001, lalu `docker compose up -d --build`.
#
# VITE_API_URL di-embed saat `vite build` — ganti domain = rebuild `web`:
#   VITE_API_URL=https://api.contoh.com docker compose up -d --build web
name: bot-baileys-ai

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "3001"
    # Lokal saja (Coolify: biarkan commented):
    # ports:
    #   - "3001:3001"
    env_file:
      - path: .env
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: 3001
      NODE_ENV: production
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
    # volumes:
    #   - ./cookies.txt:/app/cookies.txt:ro

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3001}
    restart: unless-stopped
    expose:
      - "80"
    # Lokal saja (Coolify: biarkan commented):
    # ports:
    #   - "8080:80"
    depends_on:
      - bot
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
