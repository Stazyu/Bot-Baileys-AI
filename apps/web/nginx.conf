# SPA: semua route non-file fallback ke index.html (vue-router history mode).
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Jangan cache index.html — supaya deploy baru langsung kepakai.
  location = /index.html {
    add_header Cache-Control "no-cache" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Aset fingerprint Vite (immutable) boleh di-cache lama.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
  }
}
